name: docs

on:
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - .github/workflows/docs.yml
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages deploy — uses the built-in GITHUB_TOKEN; no PAT.
permissions:
  contents: read
  pages: write
  id-token: write
  # deploy-pages reads the run's artifact via the Actions API; upstream
  # documents this as required from v4 on.
  actions: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # mkdocs-git-revision-date needs full history

      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      - run: uv sync --group docs

      - name: Build site
        run: uv run mkdocs build --strict

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v5
