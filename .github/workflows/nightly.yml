name: nightly

on:
  schedule:
    # 14:00 UTC = midnight Sydney; pre-market window for the operator.
    - cron: '0 14 * * *'
  workflow_dispatch:

# Allow auto-opening an issue on drift; testnet job needs read access to
# secrets (the secret presence is what gates the suite, not its value).
permissions:
  contents: read
  issues: write

env:
  BUN_VERSION: 1.3.14

jobs:
  # Real testnet exercise of the e2e suite. PR CI uses nock-mocked Binance
  # (#51); this job runs against https://testnet.binance.vision when the
  # operator's testnet credentials are configured. Forks without the
  # secret skip with a warning rather than failing.
  testnet-e2e:
    name: testnet-e2e
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      - uses: actions/checkout@v7
      # setup-bun unzips the release archive; the Playwright image ships no
      # unzip, so without this the job dies before any test runs.
      - name: Install unzip
        run: apt-get update && apt-get install -y --no-install-recommends unzip
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bash scripts/ci/bootstrap.sh

      - name: Skip if testnet secrets are absent
        id: gate
        env:
          KEY: ${{ secrets.BINANCE_TESTNET_API_KEY }}
          SECRET: ${{ secrets.BINANCE_TESTNET_API_SECRET }}
        run: |
          if [[ -z "$KEY" || -z "$SECRET" ]]; then
            echo 'BINANCE testnet secrets missing; skipping testnet e2e (forks / first-run).'
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Run e2e against testnet
        if: ${{ steps.gate.outputs.skip != 'true' }}
        env:
          # Firefox refuses to launch as root when $HOME belongs to another
          # user, and GitHub mounts a /github/home owned by the host runner uid
          # into this root-running container.
          HOME: /root
          BINANCE_BACKEND: testnet
          BINANCE_API_BASE: https://testnet.binance.vision
          BINANCE_WS_BASE: wss://testnet.binance.vision/ws
          BINANCE_TESTNET_API_KEY: ${{ secrets.BINANCE_TESTNET_API_KEY }}
          BINANCE_TESTNET_API_SECRET: ${{ secrets.BINANCE_TESTNET_API_SECRET }}
        run: bash scripts/ci/test-e2e.sh

  # Standing advisory check. Renovate opens security PRs on its own, but it
  # cannot for a dependency held below a known-bad version by an
  # `allowedVersions` ceiling (bullmq, see docs/architecture/worker-pipeline.md)
  # — it filters the fixed release out and says nothing. This job is what makes
  # that case audible: `bun audit` reads the lockfile directly and ignores every
  # Renovate rule.
  audit:
    name: audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # checkout@v7 still leaves the job token on disk for later git
          # commands. This job runs `bun install` and then never touches git, so
          # the credential is pure exposure — the workflow's token can write
          # issues.
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # Non-zero on any advisory at or above the level. The two accepted
      # dev-only advisories sit at moderate, so gating on high keeps this
      # quiet until something genuinely new lands.
      - run: bun audit --audit-level=high

  # Auto-open a tracking issue when the nightly job fails so the
  # operator's morning surface includes drift signals. One issue per
  # UTC day; later runs the same day add a comment with the failing-job
  # set so a re-fail is visible without spawning a duplicate issue.
  open-issue-on-failure:
    name: open-issue-on-failure
    needs: [testnet-e2e, audit]
    if: ${{ always() && (needs.testnet-e2e.result == 'failure' || needs.audit.result == 'failure') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v9
        env:
          TESTNET_RESULT: ${{ needs.testnet-e2e.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const today = new Date().toISOString().slice(0, 10);
            const failing = [];
            if (process.env.TESTNET_RESULT === 'failure') failing.push('testnet-e2e');
            if (process.env.AUDIT_RESULT === 'failure') failing.push('audit');
            const title = `nightly drift ${today}`;
            const body = [
              `Nightly run on ${today} surfaced drift in: **${failing.join(', ')}**.`,
              ``,
              `Run: ${process.env.RUN_URL}`,
              ``,
              `Triage:`,
              `- testnet-e2e failures usually mean Binance protocol or symbol-info drift.`,
              `- audit covers two steps, so read the log before concluding: \`bun install --frozen-lockfile\` fails on lockfile drift, while \`bun audit\` fails on a new high/critical advisory. For an advisory, Renovate normally opens the fix PR itself; if it has not, the package is likely held by an \`allowedVersions\` ceiling in renovate.json.`,
              ``,
              `_Auto-opened by .github/workflows/nightly.yml._`,
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'nightly-drift',
              per_page: 50,
            });
            const sameDay = existing.data.find(i => i.title === title);
            if (sameDay) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: sameDay.number,
                // Name the jobs here too: the day's first failure may have been
                // testnet-e2e and this one audit, and a bare "still failing"
                // reads as a repeat of the original.
                body: `Re-run still failing in: **${failing.join(', ')}**. ${process.env.RUN_URL}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['nightly-drift'],
              });
            }
