name: Bug report
description: Something behaves incorrectly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste an API key, secret, or full `.env` here.** Redact before posting.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a profile with ...
        2. Wait for the trigger price ...
        3. Observe ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Image tag or commit SHA. The status bar shows the build SHA.
      placeholder: 'v1.0.0'
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Binance environment
      options: [testnet, live]
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How are you running it
      options:
        - Docker Compose
        - Local development (bun run dev)
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact keys, secrets, and account identifiers first.
      render: shell
