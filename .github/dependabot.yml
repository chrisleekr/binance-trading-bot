version: 2

# Grouped hard and capped low on purpose: a single maintainer cannot read a
# firehose of one-PR-per-package. Ceiling is 4 open PRs across every ecosystem.
# Security advisories still surface through Dependabot alerts regardless.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      # Majors are split out only because they are the ones that need reading,
      # not so they arrive one per package.
      npm:
        patterns: ['*']
        update-types: [minor, patch]
      npm-major:
        patterns: ['*']
        update-types: [major]
    commit-message:
      prefix: 'chore(deps)'
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'chore(ci)'
    labels: [dependencies]

  - package-ecosystem: docker
    directory: /apps/server
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      docker:
        patterns: ['*']
    commit-message:
      prefix: 'chore(docker)'
    labels: [dependencies]
