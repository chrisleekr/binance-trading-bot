# promtool unit tests for deploy/observability/alerts.yml.
#
# `promtool check rules` validates SYNTAX only: a rule whose expression can never
# evaluate true parses clean and then stays silent forever, which is
# indistinguishable from a healthy rule that has simply not tripped. These tests
# close that gap for the rules whose correctness turns on how Prometheus SAMPLES a
# counter rather than on the threshold.
#
# The class they exist for: a labelled prom-client child does not exist until its first write and is BORN holding that write's value. The first sample Prometheus ever sees for a freshly-incremented counter is therefore a level, not a rise, and `increase()` reads it as zero. Four of the five rules below cover events whose first increment may be their ONLY one, such as a deleted position that no later pass revisits or a discovery abort that recurs at most once per refresh period, so an `increase()` form would be structurally unable to fire. Every positive case starts its series from ABSENT to reproduce that, and rewriting those four to `increase()` fails their cases here.
#
# ReconcileValueBoundDisarmed is the exception and is NOT pinned that way. Its counter
# increments on every pass, so a rising series remains and `increase()` still fires; it
# clears the threshold by extrapolation margin alone (raw delta 2 over a `> 2` bar),
# which is why the offset form is used there — determinism of what "three passes"
# means, not an inability to fire. Do not read that case as proving the form.
#
# The negative cases carry the other half: the label gates that keep these rules off routine behaviour and proof that all four recoverable conditions still RESOLVE rather than latching. `MomentumExitBlockedByFilters`, `ReconcileValueBoundDisarmed`, `DiscoveryAssetPolicyAborting`, and `PipelineApplySeedGateStoodDown` each carry a post-quiet evaluation, because a rule stuck on forever is as useless as one that never fires and a 25-hour clear is not something anyone checks by hand. `ReconcilePositionRemoved` is the deliberate exception: it reads a raw level and latches until silenced, which is the honest shape for a delete nothing undoes.
#
# The reset cases cover the restart blind spot in the offset shape; see the arm they pin in
# `alerts.yml`.
#
# Lives in a subdirectory because `discover-prometheus-rules.sh` classifies every
# top-level YAML under deploy/observability as a rules file.
#
# Run: `bash scripts/ci/promtool-lint.sh` (CI runs this on every push).
rule_files:
  - ../alerts.yml
evaluation_interval: 30s
tests:
  # A position deleted once, in the FIRST pass of a fresh process. The child is born at 1 and never moves again, because after a flatten heldQuantity is null over a sub-notional residue and every later pass takes the no-op arm. increase() sees no rise here; reading the raw counter does.
  - interval: 1m
    input_series:
      - series: reconcile_position_removed_total{profileId="p1",symbol="ENAUSDT",action="flatten-sub-notional-dust",heldBefore="nonzero"}
        values: _x5 1+0x120
    alert_rule_test:
      - eval_time: 60m
        alertname: ReconcilePositionRemoved
        exp_alerts:
          - exp_labels:
              severity: critical
              profileId: p1
              symbol: ENAUSDT
              action: flatten-sub-notional-dust
            exp_annotations:
              summary: Reconciler deleted a held position on p1/ENAUSDT
              description: 'The reconciler removed a position the strategy was claiming a quantity for, via flatten-sub-notional-dust, and dropped its avg_entry_prices row with it. Four paths run this reconcile: the boot sweep, the periodic backstop cron, the targeted symbol-reconcile job, and the mid-run reconfigure after an operator edits a profile symbol set. This is correct when the balance really is fee-and-rounding residue and destructive when the wallet snapshot or the reference price was wrong. Check the reconcileHeldQuantity warn for this symbol: it carries the wallet, the reference price, and the NOTIONAL floor the decision was made on. Nothing restores the cost basis automatically — the next pass will reconstruct it from myTrades only if the coins are still there. This alert does not clear on its own; silence it once you have judged the delete.'
    # The prune reaches the same counter under its own action label, so the rule must cover both destructive routes.
  - interval: 1m
    input_series:
      - series: reconcile_position_removed_total{profileId="p1",symbol="ENAUSDT",action="prune-phantom-ledger",heldBefore="nonzero"}
        values: _x5 1+0x120
    alert_rule_test:
      - eval_time: 60m
        alertname: ReconcilePositionRemoved
        exp_alerts:
          - exp_labels:
              severity: critical
              profileId: p1
              symbol: ENAUSDT
              action: prune-phantom-ledger
            exp_annotations:
              summary: Reconciler deleted a held position on p1/ENAUSDT
              description: 'The reconciler removed a position the strategy was claiming a quantity for, via prune-phantom-ledger, and dropped its avg_entry_prices row with it. Four paths run this reconcile: the boot sweep, the periodic backstop cron, the targeted symbol-reconcile job, and the mid-run reconfigure after an operator edits a profile symbol set. This is correct when the balance really is fee-and-rounding residue and destructive when the wallet snapshot or the reference price was wrong. Check the reconcileHeldQuantity warn for this symbol: it carries the wallet, the reference price, and the NOTIONAL floor the decision was made on. Nothing restores the cost basis automatically — the next pass will reconstruct it from myTrades only if the coins are still there. This alert does not clear on its own; silence it once you have judged the delete.'
    # heldBefore="zero" is the reconciler converging a row that was already empty after an external sale. It happens on ordinary boots, and paging on it is how this alert would get muted.
  - interval: 1m
    input_series:
      - series: reconcile_position_removed_total{profileId="p1",symbol="BTCUSDT",action="flatten-sub-notional-dust",heldBefore="zero"}
        values: _x5 1+0x120
    alert_rule_test:
      - eval_time: 60m
        alertname: ReconcilePositionRemoved
        exp_alerts: []
    # Three passes counted from series birth. The zero-seed shares a synchronous block with the first increment so no scrape observes it; subtracting the aggregate own value two hours ago is what makes "> 2" mean three passes rather than four.
  - interval: 1m
    input_series:
      - series: reconcile_value_bound_disarmed_total{profileId="p1",symbol="ENAUSDT",reason="no-reference-price"}
        values: _x5 1+0x14 2+0x14 3+0x150
    alert_rule_test:
      - eval_time: 90m
        alertname: ReconcileValueBoundDisarmed
        exp_alerts:
          - exp_labels:
              severity: warning
              profileId: p1
              symbol: ENAUSDT
              reason: no-reference-price
            exp_annotations:
              summary: Dust value bounds inert on p1/ENAUSDT (no-reference-price)
              description: Passes for this symbol keep reaching a dust value bound without no-reference-price, so the bound is not evaluating and the pass reporting no-op is not evidence the position is sound. no-reference-price means neither the miniTicker cache nor the REST fallback could price the symbol — check that the market stream is subscribed and that Binance still lists the pair. no-min-notional means the cached exchangeInfo carries no NOTIONAL filter, which an exchange-info-refresh run repairs. no-wallet-total means a balance leg Binance returned for this asset would not parse as a finite decimal, so the reconciler skipped the symbol outright before any bound was reached — check the raw getAccount balance for the base asset. A fourth, non-periodic emitter shares this series — an operator saving an entry price. If the count rose with no boot and no backstop pass to explain it, grep the worker log for pipeline_apply_avg_entry_price_value_bound_disarmed on the same symbol before chasing a sweep.
    # Two passes is a cold boot that has not healed yet, not a symbol that cannot be priced at all.
  - interval: 1m
    input_series:
      - series: reconcile_value_bound_disarmed_total{profileId="p1",symbol="ETHUSDT",reason="no-reference-price"}
        values: _x5 1+0x14 2+0x180
    alert_rule_test:
      - eval_time: 90m
        alertname: ReconcileValueBoundDisarmed
        exp_alerts: []
    # The apply path synchronously seeds all four reason children before incrementing the fired reason, so Prometheus first observes that child at 1 while its siblings are 0. The pre-hold and post-window evaluations pin the 15-minute hold and finite two-hour observation window.
  - interval: 1m
    input_series:
      - series: pipeline_apply_seed_gate_stood_down_total{profileId="p1",symbol="ENAUSDT",reason="no-client"}
        values: _x5 1+0x200
      - series: pipeline_apply_seed_gate_stood_down_total{profileId="p1",symbol="ENAUSDT",reason="no-symbol-info"}
        values: _x5 0+0x200
      - series: pipeline_apply_seed_gate_stood_down_total{profileId="p1",symbol="ENAUSDT",reason="bad-symbol-info"}
        values: _x5 0+0x200
      - series: pipeline_apply_seed_gate_stood_down_total{profileId="p1",symbol="ENAUSDT",reason="getaccount-failed"}
        values: _x5 0+0x200
    alert_rule_test:
      - eval_time: 19m
        alertname: PipelineApplySeedGateStoodDown
        exp_alerts: []
      - eval_time: 21m
        alertname: PipelineApplySeedGateStoodDown
        exp_alerts:
          - exp_labels:
              severity: warning
              profileId: p1
              symbol: ENAUSDT
              reason: no-client
            exp_annotations:
              summary: Entry-price safety check unavailable on p1/ENAUSDT (no-client)
              description: An operator entry-price apply for p1/ENAUSDT could not evaluate the position seed gate (no-client) and fell back to the recorded quantity. no-client means the Binance client resolver threw or returned no client; verify that the account and API-key rows exist, check database health, and inspect the worker warning log for pipeline_apply_avg_entry_price_gate_unavailable. no-symbol-info means the symbol-info cache was missing or unreadable; check Redis and the exchange-info-refresh job. bad-symbol-info means the cached symbol info was malformed or carried an invalid step size; refresh it and inspect the cached value. getaccount-failed means the Binance account request failed; check API-key validity, the IP allowlist, Binance reachability, and the worker log for pipeline_apply_avg_entry_price_gate_unavailable.
      - eval_time: 120m
        alertname: PipelineApplySeedGateStoodDown
        exp_alerts:
          - exp_labels:
              severity: warning
              profileId: p1
              symbol: ENAUSDT
              reason: no-client
            exp_annotations:
              summary: Entry-price safety check unavailable on p1/ENAUSDT (no-client)
              description: An operator entry-price apply for p1/ENAUSDT could not evaluate the position seed gate (no-client) and fell back to the recorded quantity. no-client means the Binance client resolver threw or returned no client; verify that the account and API-key rows exist, check database health, and inspect the worker warning log for pipeline_apply_avg_entry_price_gate_unavailable. no-symbol-info means the symbol-info cache was missing or unreadable; check Redis and the exchange-info-refresh job. bad-symbol-info means the cached symbol info was malformed or carried an invalid step size; refresh it and inspect the cached value. getaccount-failed means the Binance account request failed; check API-key validity, the IP allowlist, Binance reachability, and the worker log for pipeline_apply_avg_entry_price_gate_unavailable.
      - eval_time: 130m
        alertname: PipelineApplySeedGateStoodDown
        exp_alerts: []
    # Zero-seeded children without a fired reason are routine and must stay silent.
  - interval: 1m
    input_series:
      - series: pipeline_apply_seed_gate_stood_down_total{job="worker",instance="worker:9101",profileId="p2",symbol="BTCUSDT",reason="no-client"}
        values: _x5 0+0x60
      - series: pipeline_apply_seed_gate_stood_down_total{job="worker",instance="worker:9101",profileId="p2",symbol="BTCUSDT",reason="no-symbol-info"}
        values: _x5 0+0x60
      - series: pipeline_apply_seed_gate_stood_down_total{job="worker",instance="worker:9101",profileId="p2",symbol="BTCUSDT",reason="bad-symbol-info"}
        values: _x5 0+0x60
      - series: pipeline_apply_seed_gate_stood_down_total{job="worker",instance="worker:9101",profileId="p2",symbol="BTCUSDT",reason="getaccount-failed"}
        values: _x5 0+0x60
      - series: process_start_time_seconds{service="worker",job="worker",instance="worker:9101"}
        values: 0+0x60
    alert_rule_test:
      - eval_time: 30m
        alertname: PipelineApplySeedGateStoodDown
        exp_alerts: []
    # The split-reason case. One residual trips minQty at one price and minNotional at another, one skip each. Aggregating BEFORE the subtraction reads 2; a per-series increase() would read 0 + 0 and stay silent on exactly the split the rule claims to handle.
  - interval: 1m
    input_series:
      - series: strategy_metric_total{strategy="momentum",name="momentum.skip",side="exit",reason="min-qty",profileId="p1",symbol="ENAUSDT"}
        values: _x5 1+0x120
      - series: strategy_metric_total{strategy="momentum",name="momentum.skip",side="exit",reason="min-notional",profileId="p1",symbol="ENAUSDT"}
        values: _x8 1+0x120
    alert_rule_test:
      - eval_time: 45m
        alertname: MomentumExitBlockedByFilters
        exp_alerts:
          - exp_labels:
              severity: warning
              profileId: p1
              symbol: ENAUSDT
            exp_annotations:
              summary: 'Cannot sell ENAUSDT on p1: leftover amount is below the exchange minimum'
              description: 'The strategy tried more than once in the last hour to close its ENAUSDT position and Binance will not accept the order, because what is left is smaller than the smallest quantity — or worth less than the smallest order value — the exchange allows for this pair. THE BOT CANNOT FIX THIS. It is not waiting for a better price and retrying will not help: the amount is too small to sell at any price, so the position stays open and its cost basis keeps counting against the profile. Clear it by hand, one of two ways. Either use Binance''s "Convert Small Balance to BNB" (dust conversion) on the leftover coins, or buy a little more of the pair so the total clears the minimum and can be sold in one order. Once the wallet balance is gone the next reconcile pass drops the position and the profile is free to trade the symbol again. NOTE: this alert clears about an hour after the last refused attempt, which also happens when the price simply climbs back above the sell trigger and the strategy stops trying — the stranded amount is still there. Confirm the balance is actually gone before treating a resolve as the fix.'
    # One skip can be a momentary quote-price dip that pushed the notional under the floor for a single tick.
  - interval: 1m
    input_series:
      - series: strategy_metric_total{strategy="momentum",name="momentum.skip",side="exit",reason="min-qty",profileId="p1",symbol="SOLUSDT"}
        values: _x5 1+0x120
    alert_rule_test:
      - eval_time: 45m
        alertname: MomentumExitBlockedByFilters
        exp_alerts: []
    # Entry-side sizing skips are routine: the budget cannot buy a whole minimum lot yet and the next tick with a larger balance proceeds. The side="exit" matcher is the only thing keeping them off this page.
  - interval: 1m
    input_series:
      - series: strategy_metric_total{strategy="momentum",name="momentum.skip",side="entry",reason="min-notional",profileId="p1",symbol="ADAUSDT"}
        values: _x5 1+1x120
    alert_rule_test:
      - eval_time: 45m
        alertname: MomentumExitBlockedByFilters
        exp_alerts: []
    # This condition is recoverable, so unlike the delete above the rule must RESOLVE once the skips stop rather than latch on a counter that never decreases.
  - interval: 1m
    input_series:
      - series: strategy_metric_total{strategy="momentum",name="momentum.skip",side="exit",reason="min-qty",profileId="p1",symbol="XRPUSDT"}
        values: _x5 1+0x5 2+0x400
    alert_rule_test:
      - eval_time: 45m
        alertname: MomentumExitBlockedByFilters
        exp_alerts:
          - exp_labels:
              severity: warning
              profileId: p1
              symbol: XRPUSDT
            exp_annotations:
              summary: 'Cannot sell XRPUSDT on p1: leftover amount is below the exchange minimum'
              description: 'The strategy tried more than once in the last hour to close its XRPUSDT position and Binance will not accept the order, because what is left is smaller than the smallest quantity — or worth less than the smallest order value — the exchange allows for this pair. THE BOT CANNOT FIX THIS. It is not waiting for a better price and retrying will not help: the amount is too small to sell at any price, so the position stays open and its cost basis keeps counting against the profile. Clear it by hand, one of two ways. Either use Binance''s "Convert Small Balance to BNB" (dust conversion) on the leftover coins, or buy a little more of the pair so the total clears the minimum and can be sold in one order. Once the wallet balance is gone the next reconcile pass drops the position and the profile is free to trade the symbol again. NOTE: this alert clears about an hour after the last refused attempt, which also happens when the price simply climbs back above the sell trigger and the strategy stops trying — the stranded amount is still there. Confirm the balance is actually gone before treating a resolve as the fix.'
      - eval_time: 200m
        alertname: MomentumExitBlockedByFilters
        exp_alerts: []
    # ONE abort, ever. shouldRun stamps its Redis key on acquisition, so an abort consumes the whole refresh window and cannot recur until the next one; at the maximum legal refreshPeriodMs that is a day away. The rule has to fire on the birth write alone.
  - interval: 4m
    input_series:
      - series: discovery_asset_policy_abort_total{profileId="p1",cause="cross-check-gap"}
        values: _x5 1+0x500
    alert_rule_test:
      - eval_time: 5h
        alertname: DiscoveryAssetPolicyAborting
        exp_alerts:
          - exp_labels:
              severity: warning
              profileId: p1
              cause: cross-check-gap
            exp_annotations:
              summary: 'Discovery abandoned cycles on p1: asset policy refused (cross-check-gap)'
              description: "The stablecoin/fiat classification could not be established, so discovery has left this profile symbol set untouched and is no longer rotating it. Nothing unsafe was admitted — the cycle aborts before any add or remove. Cause cross-check-gap: no-product-rows and stablecoin-route-empty and fiat-route-empty mean the Binance product feed changed shape or renamed a key, which needs the projection in apps/worker/src/crons/discovery/asset-policy.ts updated. cross-check-gap means the feed disagrees with live exchangeInfo in bulk, which a stale feed causes and often clears on its own. empty-admission-map means this worker has no exchangeInfo cached, which the exchange-info-refresh cron repairs. product-feed-unreadable means the feed answered with something that is not this catalogue at all — not JSON, the wrong shape, or implausibly large — which is again a change to chase upstream. NOTE: product-feed-unreachable is different from the others. It means the fetch never got an answer (timeout, refused connection, error page), and a single one may already have healed: the rule holds for 25 hours after the last abort, so it can still be firing over a fault that is gone. Confirm before chasing it — open the profile page and check whether the asset-policy finding is still there, and whether discovery has rotated since. If it has, wait for the alert to resolve; if the finding is still open, the endpoint or this worker's egress is genuinely unreachable."
    # RESET AWARENESS. prom-client children die with the process but the TSDB series identity survives, so after a worker restart the plain `offset` subtrahend is the PRE-restart level while the left term is the fresh child's. The difference goes negative and the rule goes silent for the whole offset window — up to a day on the 25h rule, and a routine deploy lands inside the 1h and 2h ones. These three pin the second arm, which fires when the historical level EXCEEDS the current one; for a counter that only ever increments in-process, that ordering is reachable only through a restart.
    #
    # Written as a gap rather than a literal step down because that is what a restart looks like on the wire: the child stops being exported, then reappears holding its first post-restart write.
  - interval: 1m
    input_series:
      - series: discovery_asset_policy_abort_total{profileId="p1",cause="cross-check-gap"}
        values: '1+1x300 _x100 1+0x1400'
    alert_rule_test:
      - eval_time: 30h
        alertname: DiscoveryAssetPolicyAborting
        exp_alerts:
          - exp_labels:
              severity: warning
              profileId: p1
              cause: cross-check-gap
            exp_annotations:
              summary: 'Discovery abandoned cycles on p1: asset policy refused (cross-check-gap)'
              description: "The stablecoin/fiat classification could not be established, so discovery has left this profile symbol set untouched and is no longer rotating it. Nothing unsafe was admitted — the cycle aborts before any add or remove. Cause cross-check-gap: no-product-rows and stablecoin-route-empty and fiat-route-empty mean the Binance product feed changed shape or renamed a key, which needs the projection in apps/worker/src/crons/discovery/asset-policy.ts updated. cross-check-gap means the feed disagrees with live exchangeInfo in bulk, which a stale feed causes and often clears on its own. empty-admission-map means this worker has no exchangeInfo cached, which the exchange-info-refresh cron repairs. product-feed-unreadable means the feed answered with something that is not this catalogue at all — not JSON, the wrong shape, or implausibly large — which is again a change to chase upstream. NOTE: product-feed-unreachable is different from the others. It means the fetch never got an answer (timeout, refused connection, error page), and a single one may already have healed: the rule holds for 25 hours after the last abort, so it can still be firing over a fault that is gone. Confirm before chasing it — open the profile page and check whether the asset-policy finding is still there, and whether discovery has rotated since. If it has, wait for the alert to resolve; if the finding is still open, the endpoint or this worker's egress is genuinely unreachable."
    # Same shape on the 1h rule, where the suppression window is exactly the one a deploy sits in.
  - interval: 1m
    input_series:
      - series: strategy_metric_total{strategy="momentum",name="momentum.skip",side="exit",reason="min-qty",profileId="p1",symbol="XRPUSDT"}
        values: '1+1x60 _x10 1+1x2 3+0x200'
    alert_rule_test:
      - eval_time: 120m
        alertname: MomentumExitBlockedByFilters
        exp_alerts:
          - exp_labels:
              severity: warning
              profileId: p1
              symbol: XRPUSDT
            exp_annotations:
              summary: 'Cannot sell XRPUSDT on p1: leftover amount is below the exchange minimum'
              description: 'The strategy tried more than once in the last hour to close its XRPUSDT position and Binance will not accept the order, because what is left is smaller than the smallest quantity — or worth less than the smallest order value — the exchange allows for this pair. THE BOT CANNOT FIX THIS. It is not waiting for a better price and retrying will not help: the amount is too small to sell at any price, so the position stays open and its cost basis keeps counting against the profile. Clear it by hand, one of two ways. Either use Binance''s "Convert Small Balance to BNB" (dust conversion) on the leftover coins, or buy a little more of the pair so the total clears the minimum and can be sold in one order. Once the wallet balance is gone the next reconcile pass drops the position and the profile is free to trade the symbol again. NOTE: this alert clears about an hour after the last refused attempt, which also happens when the price simply climbs back above the sell trigger and the strategy stops trying — the stranded amount is still there. Confirm the balance is actually gone before treating a resolve as the fix.'
    # Same shape on the 2h rule. Three post-restart passes, so the `> 2` bar is cleared by the fresh child alone and the arm is not smuggling a lower threshold in.
  - interval: 1m
    input_series:
      - series: reconcile_value_bound_disarmed_total{profileId="p1",symbol="ENAUSDT",reason="no-reference-price"}
        values: '1+1x100 _x10 1+1x2 3+0x300'
    alert_rule_test:
      - eval_time: 200m
        alertname: ReconcileValueBoundDisarmed
        exp_alerts:
          - exp_labels:
              severity: warning
              profileId: p1
              symbol: ENAUSDT
              reason: no-reference-price
            exp_annotations:
              summary: Dust value bounds inert on p1/ENAUSDT (no-reference-price)
              description: Passes for this symbol keep reaching a dust value bound without no-reference-price, so the bound is not evaluating and the pass reporting no-op is not evidence the position is sound. no-reference-price means neither the miniTicker cache nor the REST fallback could price the symbol — check that the market stream is subscribed and that Binance still lists the pair. no-min-notional means the cached exchangeInfo carries no NOTIONAL filter, which an exchange-info-refresh run repairs. no-wallet-total means a balance leg Binance returned for this asset would not parse as a finite decimal, so the reconciler skipped the symbol outright before any bound was reached — check the raw getAccount balance for the base asset. A fourth, non-periodic emitter shares this series — an operator saving an entry price. If the count rose with no boot and no backstop pass to explain it, grep the worker log for pipeline_apply_avg_entry_price_value_bound_disarmed on the same symbol before chasing a sweep.
    # Same reset shape for a single seed-gate stand-down. Without the reset-aware arm, the pre-restart value suppresses the fresh child's birth write for the full two-hour window.
  - interval: 1m
    input_series:
      - series: pipeline_apply_seed_gate_stood_down_total{job="worker",instance="worker:9101",profileId="p1",symbol="ENAUSDT",reason="no-client"}
        values: '1+1x100 _x10 1+0x300'
      - series: process_start_time_seconds{service="worker",job="worker",instance="worker:9101"}
        values: '0+0x100 _x10 6660+0x300'
    alert_rule_test:
      - eval_time: 200m
        alertname: PipelineApplySeedGateStoodDown
        exp_alerts:
          - exp_labels:
              severity: warning
              profileId: p1
              symbol: ENAUSDT
              reason: no-client
            exp_annotations:
              summary: Entry-price safety check unavailable on p1/ENAUSDT (no-client)
              description: An operator entry-price apply for p1/ENAUSDT could not evaluate the position seed gate (no-client) and fell back to the recorded quantity. no-client means the Binance client resolver threw or returned no client; verify that the account and API-key rows exist, check database health, and inspect the worker warning log for pipeline_apply_avg_entry_price_gate_unavailable. no-symbol-info means the symbol-info cache was missing or unreadable; check Redis and the exchange-info-refresh job. bad-symbol-info means the cached symbol info was malformed or carried an invalid step size; refresh it and inspect the cached value. getaccount-failed means the Binance account request failed; check API-key validity, the IP allowlist, Binance reachability, and the worker log for pipeline_apply_avg_entry_price_gate_unavailable.
    # Equal counter values across a restart are still distinct stand-down events. The process start series distinguishes the fresh child without relying on a strict counter decrease.
  - interval: 1m
    input_series:
      - series: pipeline_apply_seed_gate_stood_down_total{job="worker",instance="worker:9101",profileId="p1",symbol="ENAUSDT",reason="no-client"}
        values: '1+0x100 _x10 1+0x300'
      - series: process_start_time_seconds{service="worker",job="worker",instance="worker:9101"}
        values: '0+0x100 _x10 6660+0x300'
    alert_rule_test:
      - eval_time: 125m
        alertname: PipelineApplySeedGateStoodDown
        exp_alerts: []
      - eval_time: 127m
        alertname: PipelineApplySeedGateStoodDown
        exp_alerts:
          - exp_labels:
              severity: warning
              profileId: p1
              symbol: ENAUSDT
              reason: no-client
            exp_annotations:
              summary: Entry-price safety check unavailable on p1/ENAUSDT (no-client)
              description: An operator entry-price apply for p1/ENAUSDT could not evaluate the position seed gate (no-client) and fell back to the recorded quantity. no-client means the Binance client resolver threw or returned no client; verify that the account and API-key rows exist, check database health, and inspect the worker warning log for pipeline_apply_avg_entry_price_gate_unavailable. no-symbol-info means the symbol-info cache was missing or unreadable; check Redis and the exchange-info-refresh job. bad-symbol-info means the cached symbol info was malformed or carried an invalid step size; refresh it and inspect the cached value. getaccount-failed means the Binance account request failed; check API-key validity, the IP allowlist, Binance reachability, and the worker log for pipeline_apply_avg_entry_price_gate_unavailable.
      - eval_time: 220m
        alertname: PipelineApplySeedGateStoodDown
        exp_alerts:
          - exp_labels:
              severity: warning
              profileId: p1
              symbol: ENAUSDT
              reason: no-client
            exp_annotations:
              summary: Entry-price safety check unavailable on p1/ENAUSDT (no-client)
              description: An operator entry-price apply for p1/ENAUSDT could not evaluate the position seed gate (no-client) and fell back to the recorded quantity. no-client means the Binance client resolver threw or returned no client; verify that the account and API-key rows exist, check database health, and inspect the worker warning log for pipeline_apply_avg_entry_price_gate_unavailable. no-symbol-info means the symbol-info cache was missing or unreadable; check Redis and the exchange-info-refresh job. bad-symbol-info means the cached symbol info was malformed or carried an invalid step size; refresh it and inspect the cached value. getaccount-failed means the Binance account request failed; check API-key validity, the IP allowlist, Binance reachability, and the worker log for pipeline_apply_avg_entry_price_gate_unavailable.
      - eval_time: 240m
        alertname: PipelineApplySeedGateStoodDown
        exp_alerts: []
    # RESOLVE, the other half of the header's claim. A rule that latches forever is as useless as one that never fires, and a 25-hour clear is not something anyone verifies by hand. One abort, then quiet: the subtraction returns to zero once the birth write ages past the offset, and the reset arm stands down with it because the historical level stops exceeding the current one.
  - interval: 4m
    input_series:
      - series: discovery_asset_policy_abort_total{profileId="p1",cause="cross-check-gap"}
        values: _x5 1+0x500
    alert_rule_test:
      - eval_time: 27h
        alertname: DiscoveryAssetPolicyAborting
        exp_alerts: []
    # Same for the 2h rule: three passes, then quiet, and the alert clears rather than pinning a symbol that has recovered.
  - interval: 1m
    input_series:
      - series: reconcile_value_bound_disarmed_total{profileId="p1",symbol="ENAUSDT",reason="no-reference-price"}
        values: _x5 1+0x14 2+0x14 3+0x300
    alert_rule_test:
      - eval_time: 240m
        alertname: ReconcileValueBoundDisarmed
        exp_alerts: []
